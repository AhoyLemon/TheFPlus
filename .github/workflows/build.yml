name: Build Assets

# Runs on every push to main when source assets change.
# Compiles Sass → CSS and TypeScript → JS, then commits
# the built files back so production always has fresh assets
# without requiring a build step on the server.
on:
  push:
    branches: [main]
    paths:
      - "assets/sass/**"
      - "assets/js/src/**"
      - "package.json"
      - "bun.lockb"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Need write access to push the built files back.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build CSS + JS
        run: bun run build

      - name: Commit built assets
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/css/ assets/js/thefplus.min.js
          # Only commit if something actually changed; [skip ci] prevents
          # this commit from triggering another build run.
          git diff --staged --quiet || git commit -m "chore: build assets [skip ci]"
          git push
