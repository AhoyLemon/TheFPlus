title: Other Project

columns:

  main:
    width: 2/3
    fields:
      date:
        label: Release Date
        type: date
        format: MM/DD/YYYY
        width: 1/4
      time:
        label: Release Time
        type: time
        interval: 1
        width: 1/4
      text:
        label: Page Text
        type: markdown
      show_image:
        label: Show image on page
        type: toggle
        text:
          - "No!"
          - "Sure."
        width: 1/4
      
      show_different_image:
        label: Show different image on page?
        type: toggle
        width: 1/4
        when:
          show_image: true
        text:
          - "No!"
          - "Sure."
        show:
          yes: page_image
        hide:
          no: page_image
      page_image:
        type: files
        label: Page Image
        extends: pages/image
        when:
          show_different_image: true
      cast:
        label: Cast
        type: tags
        icon: users
      tags:
        label: Project Tags
        lowercase: true
        type: tags
      tweet_intent:
        label: Custom Tweet Intent
        type: url
        placeholder: Use only if you want something different.
        icon: retweet
      bonus_content:
        label: Bonus Content
        type: markdown
        icon: code
      photos:
        label: Photos
        type: structure
        entry: >
          {{desc}}
        fields:
          series_num:
            label: Series
            type: number
            width: 1/2
          pic:
            label: Image
            fields: files
            extends: fields/image
            help: "260px in height"
          desc:
            label: Description
            type: text
            required: true
          full_size:
            label: Full Size Image
            fields: files
            extends: fields/image
        columns:
          pic:
            width: 1/2
          desc:
            width: 1/2

  sidebar:
    width: 1/3
    fields:

      cover:
        label: Teaser Image
        type: files
        extends: fields/image
        layout: cards
      category:
        label: Category
        type: select
        options:
          qe: Quite Exasperating
          irregular: Irregular
          website: Website
          merch: Merchandise
          video: YouTube Video
          else: Something Else
      
      # YouTube Video
      video_url:
        label: YouTube URL
        type: url
        icon: youtube
        help: "use the https://youtu.be syntax"
      episode_file:
        label: Episode File
        type: url
        placeholder: (if applicable)
        icon: volume-up
      baseprice:
        label: Base Price
        type: text
        placeholder: "(include $)"
        width: 1/2
      sale_status:
        label: Sale Status
        type: select
        width: 1/2
        options:
          available: Available
          pending: Pending
          soldout: Sold Out
      github_repo:
        label: GitHub Repo URL
        type: url
        placeholder: (if applicable)
        icon: github