title: Submission Hopper
icon: 🗄️

options:
  title: false
  status: false
  duplicate: false
  url: false
  delete: false

# sections:
fields:
  text:
    label: Above Table
    type: markdown
  documents:
    label: Submitted Document
    type: structure
    modalsize: large
    style: table
    sortBy: subdate
    columns:
      title: true
      submitter: true
      subdate: true
      recorded: true
    fields:
      title:
        label: Title
        type: text
        icon: file-text-o
      docurl:
        label: URL
        type: url
        icon: link
      submitter:
        label: Submitter
        type: tags
        icon: gift
        width: 1/2
      subdate:
        label: Date Submitted
        type: date
        default: today
        required: true
        width: 1/4
      gd_flag:
        label: Garbage Day?
        type: toggle
        text: flagged
        width: 1/4
        icon: trash
      dibs:
        label: Dibs
        type: tags
        icon: flag
        width: 3/4
      recorded:
        label: Recorded?
        type: toggle
        text: yup
        width: 1/4
        icon: play-circle
