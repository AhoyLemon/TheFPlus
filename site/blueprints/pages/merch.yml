title: Merch
icon: dollar
pages:
  template:
    - other-project
    - merch-type
  sort: flip
  num: date
files: true
columns:
  main:
    width: 2/3
    fields:
      text:
        label: Intro Text
        type: markdown
      current_text:
        label: Current Merch Lead In
        type: markdown

      current_merch:
        label: Current Merch
        type: structure
        style: table
        columns:
          title: true
          pic: true
          type: true
          price: true
        fields:
          title:
            label: Title
            type: text
            required: true
            width: 1/2
          pic:
            extends: fields/image
            label: Pic
            required: true
            width: 1/2
          url:
            label: URL
            type: url
          type:
            label: Type
            type: text
            width: 2/3
          price:
            label: Price
            type: text
            width: 1/3
            placeholder: "include $"
          pending:
            label: Pending?
            type: toggle
            text: yeah, these aren't for sale yet.
            width: 1/2
          almost_gone:
            label: Almost Gone?
            type: toggle
            text: yeah, these are almost gone.
            width: 1/2

      sold_text:
        label: Sold Out Lead In
        type: markdown

      sold_merch:
        label: Sold Out Merch
        type: structure
        style: table
        columns:
          title: true
          pic: true
          type: true
          sold_date: true
        fields:
          title:
            label: Title
            type: text
            required: true
            width: 2/3
          type:
            label: Type
            type: text
            width: 1/3
          url:
            label: URL
            type: url
            required: false
          pic:
            extends: fields/image
            label: Pic
            required: true
            width: 1/2
          sold_date:
            label: Sold Out Date
            type: date
            required: true
            display: MMM D, YYYY
            width: 1/2

  # Project Pages
  merchPages:
    width: 1/3
    sections:
      pages:
        extends: sections/childPages
        parent: site.find("merch")
