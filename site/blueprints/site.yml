title: Site
icon: 🤪

options:
  title: false
  duplicate: false
  status: false
  url: false
  delete: false


tabs:
  
  # Top Level Pages
  pageTab:
    label: Pages
    columns:
      - width: 1/2
        sections:
          top_pages:
            headline: Top Level Pages
            type: pages
            info: "{{ page.children.count }} children"
            layout: table
            image:
              cover: true
              ratio: 1/1
      - width: 1/2
        sections:
          hopper:
            type: pages
            headline: Submissions
            parent: site.find("submit")
            layout: cardlets  
  
  # Site Sidebar
  sidebarTab:
    label: Sidebar
    columns:
      - width: 1/2
        fields:
          sidebar_links:
            label: Sidebar Links
            type: structure
            fields:
              # slug:
              #   label: Page
              #   type: url
              #   width: 1/2
              text:
                label: Text
                type: text
                width: 1/2
              link_type:
                label: Link type:
                type: select
                width: 1/2
                required: true
                options:
                  url: URL
                  slug: Page
                  search: search
              page_slug:
                label: Page
                type: pages
                multiple: false
                when:
                  link_type: slug
              page_url:
                label: URL
                type: url
                when:
                  link_type: url
            columns:
              text: true
      - width: 1/2
        fields:
          subscribe_options:
            label: Sidebar Links
            type: structure
            fields:
              icon:
                label: Icon
                type: select
                width: 1/3
                required: true
                options:
                  rss: RSS
                  pocketcasts: Pocket Casts
                  itunes: Apple Podcasts
                  playmusic: Google Play Music
                  overcast: Overcast
                  radiopublic: Radio Public
                  podchaser: Podchaser
              url:
                label: URL
                type: url
                width: 2/3
                required: true
              text:
                label: Text
                type: text
                required: true
          social_links:
            label: Social Links
            type: structure
            fields:
              icon:
                label: Icon
                type: select
                width: 1/3
                required: true
                options:
                  ballpit: Ball Pit
                  twitter: Twitter
                  github: GitHub
                  youtube: YouTube
                  rss: RSS
                  pocketcasts: Pocket Casts
                  itunes: iTunes
                  paypal: PayPal
                  podchaser: Podchaser
                  lemon: Lemon
                  damndog: Damn Dog
                  twitch: Twitch
                  soundcloud: Soundcloud
                  mastodon: Mastodon
              url:
                label: URL
                type: url
                width: 2/3
                required: true
              text:
                label: Text
                type: text
                required: true

  # Site Meta
  siteMetaTab:
    label: Site MetaInfo
    # columns:
    #   - width: 1/1
    fields:
      email:
        label: Site Admin Email
        type: email
        required: true
        width: 1/2
      twitter_handle:
        label: Twitter Handle (no @)
        type: text
        placeholder: (no @)
        icon: twitter
        width: 1/2
        required: false
      schema_sameas:
        label: Schema SameAs
        type: structure
        fields:
          url:
            label: URL
            type: url
      description:
        extends: fields/simpletext
      copyright:
        label: Copyright
        type:  text

  # Episode Pages
  episodeTab:
    label: F+ Episodes
    sections:
      episodes:
        extends: sections/episodePages
        status: listed
        layout: cards
        size: medium
        limit: 48

  # Projects & Merch
  projectTab:
    label: Projects & Merch
    columns:
      - width: 1/2
        sections:
          projectItems:
            type: pages
            parent: site.find("also-made")
            template:
              - other-project
            layout: cardlets
            size: small
            sortBy: date desc
            sortable: false
      - width: 1/2
        sections:
          merchItems:
            type: pages
            parent: site.find("merch")
            template:
              - merch-type
              - stickers
            layout: cardlets
            size: small
            sortBy: date desc
            sortable: false

  # People
  peopleTab:
    label: People
    columns:
      - width: 1/1
        sections:
          ridiculists:
            type: pages
            parent: site.find("meet")
            layout: cardlets
            size: small
            sortBy: date desc
            sortable: false
            info: '<strong style="text-transform:capitalize">{{page.role}}</strong><br />{{page.job}}'
            limit: 40
  
  # People
  fanartTab:
    label: Fanart
    columns:
      - width: 1/1
        sections:
          fanartFiles:
            parent: site.find('fanart')
            label: Fanart Images
            type: files
            layout: cardlets
            template: fanimage